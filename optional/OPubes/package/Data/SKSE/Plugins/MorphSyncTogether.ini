; MorphSyncTogether v0.2.11
;
; Standalone Skyrim Together / RaceMenu BodyMorph synchronizer.
; This port is intentionally different from OStimTogether's 27991.

[Network]
Disabled=0
AutoDiscovery=1
LocalPort=27992
DiscoveryIntervalMs=1000
PeerTimeoutMs=10000

; Manual fallback (used only when AutoDiscovery=0)
PeerHost=
PeerPort=27992

[MorphSync]
; How often the real local player is sampled for changed RaceMenu morphs.
SyncIntervalMs=1000

; Re-send an unchanged authoritative snapshot periodically so a newly-created
; STR proxy can still acquire it without an explicit connection event API.
FullResendMs=5000

; Slowly reassert the last remote snapshot in case OBody redistributes a local
; preset to the STR proxy after the initial sync.
RemoteReapplyMs=5000

; 1 = remote owner's snapshot fully replaces locally-assigned morphs on proxy.
ClearRemoteMorphs=1

[PubicOverlaySync]
; Synchronize OPubes/OPubesRaceMenuSelector texture, color and alpha.
; Tattoos and temporary OCum overlays are deliberately ignored.
; The FOMOD enables this only when the user selects OPubes support.
Enabled=1

[AppearanceProbe]
; Crash-safe RaceMenu/SKEE and scenegraph diagnostics.
Enabled=1
IntervalMs=1000
Verbose=1

[AppearancePreserve]
; Cache the first healthy FaceGen material state for each remote player identity.
Enabled=1

; Number of overlay/material recovery passes if the overlay holder disappears.
RecoveryAttempts=3

[FaceMaterialRebind]
; v0.2.10: after restoring a drifted FaceGen tint texture, clear render passes,
; run shader geometry setup/finish, and mark the material dirty for rendering.
Enabled=1

; Repeat the full material restore/rebind to cover late OStim render work.
FollowupPasses=3
FollowupIntervalMs=1000
