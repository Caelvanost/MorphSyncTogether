; MorphSyncTogether v0.3.4
;
; Skyrim Together / RaceMenu appearance synchronizer using STRPluginMessagingAPI.

[Network]
; 1 disables MorphSyncTogether. STRPM owns discovery, peer identity and transport.
Disabled=0

[MorphSync]
SyncIntervalMs=1000
FullResendMs=5000
; Safety fallback only. Repeated STRPM snapshots refresh the authoritative state every 5s.
RemoteReapplyMs=15000
ClearRemoteMorphs=1

[PubicOverlaySync]
; Global BodyHairSliders/OPubes overlay transport switch.
; Individual providers are selected by FOMOD marker files under:
; Data/SKSE/Plugins/MorphSyncTogether/Providers/
Enabled=1

[AppearanceProbe]
Enabled=1
IntervalMs=1000
Verbose=1

[AppearancePreserve]
Enabled=1
RecoveryAttempts=3

[FaceMaterialRebind]
Enabled=1
FollowupPasses=3
FollowupIntervalMs=1000
