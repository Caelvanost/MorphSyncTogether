; MorphSyncTogether v0.2.7
;
; Standalone Skyrim Together / RaceMenu BodyMorph synchronizer.
; This port is intentionally different from OStimTogether's 27991.

[Network]
Disabled=0
AutoDiscovery=1
LocalPort=27992
DiscoveryIntervalMs=1000
PeerTimeoutMs=10000

; Manual fallback (used only when AutoDiscovery=0)
PeerHost=
PeerPort=27992

[MorphSync]
; How often the real local player is sampled for changed RaceMenu morphs.
SyncIntervalMs=1000

; Re-send an unchanged authoritative snapshot periodically so a newly-created
; STR proxy can still acquire it without an explicit connection event API.
FullResendMs=5000

; Slowly reassert the last remote snapshot in case OBody redistributes a local
; preset to the STR proxy after the initial sync.
RemoteReapplyMs=5000

; 1 = remote owner's snapshot fully replaces locally-assigned morphs on proxy.
; This is required if OBody has distributed a different preset locally.
ClearRemoteMorphs=1


[AppearanceProbe]
; Crash-safe appearance diagnostics. Captures RaceMenu/SKEE overlay/node
; state plus relevant scenegraph names. Native PlayerCharacter TintMask APIs
; remain deliberately disabled after a confirmed AE 1.6.1170 crash.
; Mutation is confined to the separate [AppearancePreserve] recovery path.
Enabled=1

; Probe cadence. Detailed lines are emitted only on first observation or when
; the appearance fingerprint changes.
IntervalMs=1000

; 1 = log every captured overlay/interesting scene node on changes.
Verbose=1

[AppearancePreserve]
; Cache the first healthy FaceGen material state for each remote player identity.
; The cache survives STR replacing the transient FFxxxxxx proxy. If OStim
; changes the FaceGen tint texture, restore the baseline and refresh the 3D.
Enabled=1

; Number of post-refresh material/overlay follow-up passes.
RecoveryAttempts=3

; Legacy render-material guard kept as a fallback. v0.2.7 first reloads a
; RaceMenu face preset + generated tint DDS when the proxy tint drifts.
RefreshOnTintDrift=1

; After the lighter QueueNiNodeUpdate/follow-up window, issue one stronger
; Actor.RegenerateHead() fallback. The plugin can inspect material state but
; cannot directly test whether the final rendered makeup pixels are visible.
RegenerateHeadFallback=1

; Minimum delay before escalating QueueNiNodeUpdate -> RegenerateHead.
RefreshCooldownMs=2500


[RaceMenuPresetGuard]
; v0.2.7: save the first healthy remote proxy face through RaceMenu's public
; Preset interface, including the generated tint DDS. On later tint drift,
; reload only the face portion of that preset. This avoids unsafe TintMask
; internals and restores the actual baked tint texture instead of only a pointer.
Enabled=1

; Minimum time between face-preset reloads for the same remote player.
ReloadCooldownMs=1000
